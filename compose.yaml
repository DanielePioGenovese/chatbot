services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  qdrant:
    build:
      context: .
      dockerfile: src/qdrant_service/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - chatbot

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlruns/mlflow.db
        --artifacts-destination /mlruns/artifacts
        --serve-artifacts
        --allowed-hosts *
    environment:
      - PYTHONUNBUFFERED=1 
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - chatbot

  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    volumes:
      - ./model_weights:/data
      - ./models:/models
    ports:
      - "8222:8000"
    command: >
      --model /models/main_model
      --served-model-name main_model
      --max-model-len 8192
      --enable-auto-tool-choice
      --tool-call-parser hermes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s 
    networks:
      - chatbot

  # ── One-shot jobs ─────────────────────────────────────────────────────────

  mlflow-app:
    build:
      context: .
      dockerfile: src/mlflow_service/Dockerfile
    container_name: mlflow-app
    restart: "no"                          
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTHONUNBUFFERED=1 
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ~/.cache/huggingface/hub:/root/.cache/huggingface/hub
      - ./mlruns/artifacts/:/mlruns/artifacts/
      - ./models:/models
    command: uv run -m main
    networks:
      - chatbot

  ingestionrag:
    build:
      context: .
      dockerfile: src/ingestionrag_service/Dockerfile
    restart: "no"                          
    runtime: nvidia
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./docs:/docs:ro
    networks:
      - chatbot

  # ── Application layer ─────────────────────────────────────────────────────

  mcpserver:
    build:
      context: .
      dockerfile: src/mcp_server_service/Dockerfile
    container_name: mcpserver
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    ports:
      - "8021:8021"
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 3 -X POST http://localhost:8021/mcp -H 'Content-Type: application/json' -d '{}' -o /dev/null; test $? -ne 7"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s
    depends_on:
      qdrant:
        condition: service_healthy
      ingestionrag:
        condition: service_completed_successfully  
      mlflow-app:
        condition: service_completed_successfully   
    networks:
      - chatbot

  app:
    build:
      context: .
      dockerfile: src/agent/Dockerfile
    container_name: app
    environment:
      - PYTHONUNBUFFERED=1 
    ports:
      - "9997:9997"
    # depends_on:
    #   mcpserver:
    #     condition: service_healthy
    #   vllm:
    #     condition: service_healthy
    #   mlflow:
    #     condition: service_healthy
    networks:
      - chatbot

networks:
  chatbot:
    driver: bridge