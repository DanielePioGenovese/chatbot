services:
  qdrant:
    build:
      context: .
      dockerfile: src/qdrant_service/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    volumes:
      - ./qdrant_data:/qdrant/qdrant_data
    networks:
      - chatbot

  ingestionrag:
    build:
      context: .
      dockerfile: src/ingestionrag_service/Dockerfile
    runtime: nvidia
    volumes:
      - ./docs:/docs:ro
    networks:
      - chatbot

  mcpserver:                          
    build:
      context: .
      dockerfile: src/mcp_server_service/Dockerfile
    container_name: mcpserver
    ports:
      - "8021:8021"
    depends_on:
      qdrant:
        condition: service_healthy    
    networks:
      - chatbot

  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    volumes:
      - ./model_weights:/data
      - ./models:/models
    ports:
      - "8222:8000"
    command: >
      --model /models/main_model
      --served-model-name main_model
      --max-model-len 4096
      --enable-auto-tool-choice
      --tool-call-parser hermes
    networks:
      - chatbot

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --artifacts-destination /mlruns/artifacts
      --serve-artifacts
      --allowed-hosts *
    networks:
      - chatbot

  mlflow-app:
    build:
      context: .
      dockerfile: src/mlflow_service/Dockerfile
    container_name: mlflow-app
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
    depends_on:
      - mlflow
    volumes:
      - ~/.cache/huggingface/hub:/root/.cache/huggingface/hub
      - /mlruns/artifacts/
      - ./models:/models
    command: uv run -m main
    networks:
      - chatbot

  app:
    build:
      context: .
      dockerfile: src/agent/Dockerfile
    container_name: app
    ports:
      - "9998:9998"
    depends_on:
      - mlflow
      - mcpserver
      - vllm
    networks:
      - chatbot

networks:
  chatbot:
    driver: bridge