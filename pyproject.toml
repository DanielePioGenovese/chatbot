[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.4.2",
    "huggingface-hub>=0.36.2",
    "pydantic-ai>=1.61.0",
    "qdrant-client>=1.12.1",
    "setuptools>=80.10.2",
    "torch",
    "transformers<5.0",
    "vllm>=0.7.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.workspace]
members = [
    "src/ingestionrag_service",
]
