service:
  qdrant:
    build:
      context: .
      dockerfile: services/qdrant_service/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      stard_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    volumes:
      - ./qdrant_data:/qdrant/qdrant_data
    