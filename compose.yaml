services:
  qdrant:
    build:
      context: .
      dockerfile: src/qdrant_service/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    volumes:
      - ./qdrant_data:/qdrant/qdrant_data

  ingestionrag:
    build: 
      context: .
      dockerfile: src/ingestionrag_service/Dockerfile
    runtime: nvidia
    volumes:
      - ./docs:/docs:ro

  vllm:
    build:
      context: .
      dockerfile: src/vllm_service/Dockerfile
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES= all
      - HF_HOME=/root/.cache/huggingface
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    volumes:
      - ./local_models/hf_cache:/root/.cache/huggingface  
    ports:
      - "8222:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s 
    restart: unless-stopped

mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports:
      - "5000:5000" 
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"